<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Notepad</title>
<style>
  :root {
    --paper: #ece3d0;      /* warm cream surface */
    --ink: #211d15;        /* near-black warm */
    --ink-soft: #6f6551;
    --ink-faint: #9c9174;
    --accent: #cf4f22;     /* TE-style warm orange */
    --accent-ink: #f7efdd;
    --line: #cabd9c;       /* hairline on paper */
    --screen: #e4d9c1;     /* inset readout */
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16130e;
      --ink: #e8dfca;
      --ink-soft: #a1957c;
      --ink-faint: #6c6350;
      --accent: #e0602c;
      --accent-ink: #16130e;
      --line: #342e21;
      --screen: #1e1a13;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(14px, 4vw, 44px);
  }
  .shell {
    width: 100%;
    max-width: 960px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--ink-soft);
  }

  /* Header plate — inverted, like a hardware label strip */
  .plate {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--ink);
    color: var(--paper);
    padding: 11px 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase;
  }
  .brand .mark { width: 11px; height: 11px; background: var(--accent); flex: 0 0 auto; }
  .sys {
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--paper); opacity: .72; text-align: right;
  }

  /* Two-column workspace: editor on the left, note library on the right */
  .workspace { display: flex; align-items: stretch; }
  .body {
    flex: 1 1 auto; min-width: 0;
    padding: clamp(16px, 3.5vw, 26px); display: flex; flex-direction: column; gap: 20px;
  }

  /* Control row */
  .controls { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .rec-wrap { display: flex; flex-direction: column; align-items: center; gap: 9px; flex: 0 0 auto; }
  .record {
    --size: 80px;
    position: relative;
    width: var(--size); height: var(--size);
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    display: grid; place-items: center;
    /* paper gap + ink bezel ring */
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ink);
    transition: transform .12s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
  }
  .record:hover:not(:disabled) { transform: translateY(-1.5px); }
  .record:active:not(:disabled) { transform: translateY(1px) scale(.97); }
  .record:disabled { opacity: .38; cursor: not-allowed; }
  .record .glyph {
    width: 22px; height: 22px; border-radius: 50%;
    background: currentColor;
    transition: border-radius .16s ease, width .16s ease, height .16s ease;
  }
  .record.recording { animation: pulse 1.5s ease-out infinite; }
  .record.recording .glyph { border-radius: 0; width: 20px; height: 20px; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ink), 0 0 0 6px rgba(207,79,34,.5); }
    70%  { box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ink), 0 0 0 20px rgba(207,79,34,0); }
    100% { box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--ink), 0 0 0 20px rgba(207,79,34,0); }
  }
  .rec-label { color: var(--ink-faint); font-size: 9px; letter-spacing: 0.16em; }

  /* Status readout screen */
  .screen {
    flex: 1 1 190px;
    min-height: 62px;
    align-self: stretch;
    display: flex; flex-direction: column; justify-content: center; gap: 5px;
    background: var(--screen);
    border: 1.5px solid var(--ink);
    padding: 12px 15px;
  }
  .status-line { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; }
  .status-line .pip { width: 9px; height: 9px; background: var(--ink-faint); flex: 0 0 auto; }
  .status-line.is-recording { color: var(--accent); }
  .status-line.is-recording .pip { background: var(--accent); animation: blink 1s steps(2) infinite; }
  .status-line.is-done .pip { background: var(--accent); }
  .status-line.is-transcribing .pip { background: var(--ink); animation: blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .timer { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid var(--line); border-top-color: var(--ink);
    animation: spin .7s linear infinite; display: none;
  }
  .is-transcribing .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Options */
  .opts { display: flex; gap: 14px; margin-left: auto; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  select, .seg button {
    font-family: var(--mono);
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 0;
    padding: 8px 10px;
    cursor: pointer;
  }
  select { min-width: 128px; }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); }
  .seg button { border: none; border-radius: 0; background: var(--paper); color: var(--ink-soft); font-weight: 600; }
  .seg button + button { border-left: 1.5px solid var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Notepad */
  .pad { border: 1.5px solid var(--ink); background: var(--paper); }
  .txt {
    display: block; width: 100%;
    min-height: 44vh; resize: vertical;
    border: none; background: transparent; color: var(--ink);
    font-family: var(--mono);
    font-size: 14.5px; line-height: 1.7;
    padding: 20px 20px 16px;
    outline-offset: -2px;
  }
  .txt::placeholder { color: var(--ink-faint); }
  .txt.flash { animation: flash .9s ease; }
  @keyframes flash { from { background: rgba(207,79,34,.1); } to { background: transparent; } }

  footer {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 14px;
    border-top: 1.5px solid var(--ink);
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .count { font-variant-numeric: tabular-nums; }
  .detected { color: var(--ink-faint); }
  .savestate { color: var(--ink-faint); }
  .savestate.is-saving { color: var(--ink-soft); }
  .savestate.is-error { color: var(--accent); }
  footer .grow { margin-left: auto; display: flex; gap: 0; border: 1.5px solid var(--ink); }
  .ghost {
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
    border: none; background: var(--paper); color: var(--ink);
    padding: 8px 14px; cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .ghost + .ghost { border-left: 1.5px solid var(--ink); }
  .ghost:hover { background: var(--ink); color: var(--paper); }
  .ghost.copied { background: var(--accent); color: var(--accent-ink); }

  /* Notes sidebar */
  .sidebar {
    flex: 0 0 248px;
    border-left: 1.5px solid var(--ink);
    display: flex; flex-direction: column;
    background: var(--paper);
  }
  .sidebar-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1.5px solid var(--ink);
  }
  .new-note {
    font-family: var(--mono);
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
    display: inline-flex; align-items: center; gap: 7px;
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 6px 11px; cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .new-note:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .new-note .plus { font-size: 14px; line-height: 1; }

  .note-list { flex: 1 1 auto; overflow-y: auto; max-height: 62vh; }
  .note-empty { padding: 20px 14px; color: var(--ink-faint); font-size: 11px; line-height: 1.6; letter-spacing: 0.04em; }
  .note-item {
    position: relative;
    padding: 11px 13px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    display: flex; flex-direction: column; gap: 4px;
    transition: background .1s ease;
  }
  .note-item:hover { background: var(--screen); }
  .note-item.active { background: var(--screen); box-shadow: inset 3px 0 0 var(--accent); }
  .note-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 42px;
  }
  .note-time { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  .note-actions {
    position: absolute; top: 9px; right: 10px;
    display: none; gap: 4px;
  }
  .note-item:hover .note-actions, .note-item.active .note-actions { display: flex; }
  .icon-btn {
    font-family: var(--mono); font-size: 11px; line-height: 1;
    width: 22px; height: 22px; display: grid; place-items: center;
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    cursor: pointer; padding: 0;
  }
  .icon-btn:hover { background: var(--ink); color: var(--paper); }
  .icon-btn.danger:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .rename-input {
    font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    width: 100%; border: 1.5px solid var(--accent); background: var(--paper); color: var(--ink);
    padding: 3px 5px; border-radius: 0;
  }

  /* Error / info banner */
  .banner {
    display: none; align-items: flex-start; gap: 10px;
    padding: 12px 14px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--ink); font-size: 12px; line-height: 1.55; letter-spacing: 0.02em;
  }
  .banner::before { content: "!"; font-weight: 700; color: var(--accent); flex: 0 0 auto; }
  .banner.show { display: flex; }
  .banner.info { border-color: var(--ink); }
  .banner.info::before { content: "i"; color: var(--ink); }
  .banner strong { font-weight: 700; }
  .banner code { font-family: var(--mono); background: var(--screen); padding: 1px 4px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 760px) {
    .workspace { flex-direction: column; }
    .sidebar { flex: 0 0 auto; border-left: none; border-top: 1.5px solid var(--ink); }
    .note-list { max-height: 34vh; }
  }
  @media (max-width: 540px) {
    .controls { gap: 14px; }
    .opts { margin-left: 0; width: 100%; }
    .field { flex: 1; }
    select { width: 100%; }
    .sys { display: none; }
  }
</style>
</head>
<body>
  <main class="shell">
    <div class="plate">
      <div class="brand"><span class="mark"></span>Voice Notepad</div>
      <div class="sys" id="meta">local · private</div>
    </div>

    <div class="workspace">
      <div class="body">
        <div class="banner" id="banner" role="alert"></div>

        <div class="controls">
          <div class="rec-wrap">
            <button class="record" id="record" aria-label="Start recording" disabled>
              <span class="glyph"></span>
            </button>
            <span class="rec-label">Push / Space</span>
          </div>

          <div class="screen">
            <div class="status-line" id="statusLine">
              <span class="pip"></span>
              <span id="statusText">Loading model…</span>
              <span class="spinner"></span>
            </div>
            <div class="timer" id="timer" hidden>00:00</div>
          </div>

          <div class="opts">
            <div class="field">
              <span class="label">Mode</span>
              <div class="seg" role="group" aria-label="Insert mode">
                <button id="modeAppend" aria-pressed="true">Append</button>
                <button id="modeReplace" aria-pressed="false">Replace</button>
              </div>
            </div>
            <div class="field">
              <label class="label" for="lang">Lang</label>
              <select id="lang" aria-label="Language">
                <option value="auto">Auto</option>
                <option value="pl">Polski</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
        </div>

        <section class="pad">
          <textarea class="txt" id="pad" placeholder="Press record and start speaking. Your words land here. Edit freely — notes save automatically."></textarea>
          <footer>
            <span class="count" id="count">Chars 0000</span>
            <span class="detected" id="detected"></span>
            <span class="savestate" id="saveState"></span>
            <span class="grow">
              <button class="ghost" id="copy">Copy all</button>
              <button class="ghost" id="clear">Clear</button>
            </span>
          </footer>
        </section>
      </div>

      <aside class="sidebar" aria-label="Saved notes">
        <div class="sidebar-head">
          <span class="label">Notes</span>
          <button class="new-note" id="newNote"><span class="plus">+</span>New</button>
        </div>
        <div class="note-list" id="noteList"></div>
      </aside>
    </div>
  </main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const pad = $("pad"), recordBtn = $("record"), statusLine = $("statusLine"),
        statusText = $("statusText"), timerEl = $("timer"), banner = $("banner"),
        langSel = $("lang"), countEl = $("count"), detectedEl = $("detected"),
        meta = $("meta"), modeAppend = $("modeAppend"), modeReplace = $("modeReplace"),
        saveStateEl = $("saveState"), noteListEl = $("noteList"), newNoteBtn = $("newNote");

  const LS = { lang: "vn.lang", mode: "vn.mode", active: "vn.active" };
  let mode = localStorage.getItem(LS.mode) || "append";
  let modelReady = false, recording = false, starting = false, stream = null, recorder = null,
      chunks = [], tick = null, startedAt = 0;

  // notes state
  let notes = [];          // summaries: {id, title, created_at, updated_at, renamed}
  let activeId = null;
  let renamingId = null;   // set while a rename input is open in the list
  let dirty = false, saveTimer = null;

  // ---- restore persisted prefs ----
  // An explicit pick wins; otherwise checkHealth applies the server's DEFAULT_LANGUAGE.
  if (localStorage.getItem(LS.lang)) langSel.value = localStorage.getItem(LS.lang);
  setMode(mode);
  updateCount();

  // ---- helpers ----
  function updateCount() {
    countEl.textContent = `Chars ${String(pad.value.length).padStart(4, "0")}`;
  }
  function setStatus(text, state) {
    statusText.textContent = text;
    statusLine.className = "status-line" + (state ? " is-" + state : "");
  }
  function setSave(text, kind) {
    saveStateEl.textContent = text;
    saveStateEl.className = "savestate" + (kind ? " is-" + kind : "");
  }
  function showBanner(html, kind = "error") {
    banner.className = "banner show" + (kind === "info" ? " info" : "");
    banner.innerHTML = html;
  }
  function clearBanner() { banner.className = "banner"; banner.innerHTML = ""; }
  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }
  function relTime(epochS) {
    const diff = Date.now() / 1000 - epochS;
    if (diff < 60) return "just now";
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    const d = new Date(epochS * 1000);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function setMode(m) {
    mode = m;
    const app = m === "append";
    modeAppend.setAttribute("aria-pressed", String(app));
    modeReplace.setAttribute("aria-pressed", String(!app));
    localStorage.setItem(LS.mode, m);
  }

  async function api(method, url, body) {
    const opt = { method, headers: {} };
    if (body !== undefined) {
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    const r = await fetch(url, opt);
    if (!r.ok) throw new Error(`${method} ${url} → ${r.status}`);
    return r.status === 204 ? null : r.json();
  }

  function insertText(text) {
    if (mode === "replace") {
      pad.value = text;
    } else if (pad.value.trim() === "") {
      pad.value = text;
    } else {
      pad.value = pad.value.replace(/\s+$/, "") + "\n\n" + text;
    }
    updateCount();
    pad.scrollTop = pad.scrollHeight;
    pad.classList.remove("flash"); void pad.offsetWidth; pad.classList.add("flash");
    scheduleSave();
  }

  // ---- notes: list rendering ----
  function renderList() {
    // A rebuild would destroy the open rename input; the rename's commit re-renders.
    if (renamingId) return;
    noteListEl.textContent = "";
    if (notes.length === 0) {
      const empty = document.createElement("div");
      empty.className = "note-empty";
      empty.textContent = "No notes yet. Record something or start typing.";
      noteListEl.appendChild(empty);
      return;
    }
    for (const n of notes) {
      const item = document.createElement("div");
      item.className = "note-item" + (n.id === activeId ? " active" : "");
      item.dataset.id = n.id;

      const title = document.createElement("div");
      title.className = "note-title";
      title.textContent = n.title;

      const time = document.createElement("div");
      time.className = "note-time";
      time.textContent = relTime(n.updated_at);

      const actions = document.createElement("div");
      actions.className = "note-actions";
      const renameBtn = document.createElement("button");
      renameBtn.className = "icon-btn"; renameBtn.title = "Rename"; renameBtn.textContent = "✎";
      renameBtn.addEventListener("click", (e) => { e.stopPropagation(); startRename(item, n); });
      const delBtn = document.createElement("button");
      delBtn.className = "icon-btn danger"; delBtn.title = "Delete"; delBtn.textContent = "✕";
      delBtn.addEventListener("click", (e) => { e.stopPropagation(); deleteNote(n); });
      actions.append(renameBtn, delBtn);

      item.append(title, time, actions);
      item.addEventListener("click", () => { if (n.id !== activeId) openNote(n.id); });
      noteListEl.appendChild(item);
    }
  }

  function reorderActiveToTop(summary) {
    notes = notes.filter((n) => n.id !== summary.id);
    notes.unshift(summary);
  }

  // ---- notes: CRUD ----
  async function loadNotes() {
    try {
      notes = await api("GET", "/api/notes");
    } catch {
      notes = [];
    }
    renderList();
    const prefer = localStorage.getItem(LS.active);
    if (notes.length === 0) {
      await newNote();
    } else {
      const target = notes.find((n) => n.id === prefer) ? prefer : notes[0].id;
      await openNote(target);
    }
  }

  async function openNote(id) {
    await flushSave();
    try {
      const note = await api("GET", `/api/notes/${id}`);
      activeId = note.id;
      localStorage.setItem(LS.active, note.id);
      pad.value = note.content;
      dirty = false;
      updateCount();
      detectedEl.textContent = "";
      setSave("");
      renderList();
    } catch {
      showBanner("<strong>Couldn’t open that note.</strong> It may have been removed.");
      await loadNotes();
    }
  }

  async function newNote() {
    await flushSave();
    try {
      const note = await api("POST", "/api/notes", { content: "" });
      notes.unshift({ id: note.id, title: note.title, created_at: note.created_at,
                      updated_at: note.updated_at, renamed: note.renamed });
      activeId = note.id;
      localStorage.setItem(LS.active, note.id);
      pad.value = "";
      dirty = false;
      updateCount();
      detectedEl.textContent = "";
      setSave("");
      renderList();
      pad.focus();
    } catch {
      showBanner("<strong>Couldn’t create a note.</strong> Is the server still running?");
    }
  }

  async function deleteNote(summary) {
    if (!confirm(`Delete “${summary.title}”? This removes the file from disk.`)) return;
    try {
      await api("DELETE", `/api/notes/${summary.id}`);
    } catch {
      showBanner("<strong>Couldn’t delete that note.</strong>");
      return;
    }
    notes = notes.filter((n) => n.id !== summary.id);
    if (activeId === summary.id) {
      activeId = null;
      if (notes.length) await openNote(notes[0].id);
      else await newNote();
    } else {
      renderList();
    }
  }

  function startRename(item, summary) {
    const titleEl = item.querySelector(".note-title");
    const input = document.createElement("input");
    input.className = "rename-input";
    input.value = summary.title;
    renamingId = summary.id;
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    let done = false;
    const commit = async (save) => {
      if (done) return; done = true;
      if (save) {
        const title = input.value.trim();
        if (title && title !== summary.title) {
          try {
            const updated = await api("PUT", `/api/notes/${summary.id}`, { title });
            // An autosave may have swapped in a fresh summary object meanwhile.
            const current = notes.find((n) => n.id === summary.id);
            if (current) {
              current.title = updated.title;
              current.renamed = updated.renamed;
              current.updated_at = updated.updated_at;
            }
          } catch { showBanner("<strong>Couldn’t rename that note.</strong>"); }
        }
      }
      renamingId = null;
      renderList();
    };
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commit(true); }
      else if (e.key === "Escape") { e.preventDefault(); commit(false); }
    });
    input.addEventListener("blur", () => commit(true));
    input.addEventListener("click", (e) => e.stopPropagation());
  }

  // ---- notes: autosave ----
  function scheduleSave() {
    dirty = true;
    setSave("Saving…", "saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 600);
  }

  async function flushSave() {
    clearTimeout(saveTimer);
    if (!dirty || !activeId) return;
    dirty = false;
    const id = activeId;
    try {
      const updated = await api("PUT", `/api/notes/${id}`, { content: pad.value });
      const summary = { id: updated.id, title: updated.title, created_at: updated.created_at,
                        updated_at: updated.updated_at, renamed: updated.renamed };
      reorderActiveToTop(summary);
      renderList();
      setSave("Saved", "");
    } catch {
      dirty = true;
      setSave("Save failed", "error");
    }
  }

  // ---- health ----
  async function checkHealth() {
    try {
      const r = await fetch("/api/health");
      const h = await r.json();
      meta.textContent = `${h.model} · ${h.device} · local`;
      if (!localStorage.getItem(LS.lang) && h.default_language) langSel.value = h.default_language;
      if (h.status === "ok") {
        modelReady = true;
        recordBtn.disabled = false;
        setStatus("Ready", "");
      } else if (h.status === "error") {
        // Loading won't recover on its own: stop polling and say why.
        setStatus("Model error", "");
        showBanner("<strong>Model failed to load.</strong> Check <code>WHISPER_MODEL</code> in <code>.env</code>, then restart. ");
        banner.append(h.error || "");
      } else {
        setStatus("Loading model…", "transcribing");
        setTimeout(checkHealth, 1200);
      }
    } catch {
      setStatus("No server", "");
      showBanner("<strong>Can’t reach the server.</strong> Is <code>uvicorn</code> running on this machine?");
      setTimeout(checkHealth, 2000);
    }
  }

  // ---- recording ----
  async function startRecording() {
    // getUserMedia is async (and may wait on a permission prompt): a second start in
    // that window would open another stream and leak the first, leaving the mic on.
    if (recording || starting) return;
    starting = true;
    clearBanner();
    detectedEl.textContent = "";
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      showBanner(denied
        ? "<strong>Microphone blocked.</strong> Allow mic access for this site in your browser, then try again."
        : "<strong>No microphone found.</strong> Check that a mic is connected and available.");
      return;
    } finally {
      starting = false;
    }
    chunks = [];
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
               : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onRecordingStop;
    recorder.start();

    recording = true;
    recordBtn.classList.add("recording");
    recordBtn.setAttribute("aria-label", "Stop recording");
    setStatus("Recording", "recording");
    startedAt = Date.now();
    timerEl.hidden = false; timerEl.textContent = "00:00";
    tick = setInterval(() => {
      timerEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000));
    }, 250);
  }

  function stopRecording() {
    if (!recorder) return;
    recording = false;
    clearInterval(tick);
    recordBtn.classList.remove("recording");
    recordBtn.setAttribute("aria-label", "Start recording");
    recorder.stop();
    stream.getTracks().forEach((t) => t.stop());
  }

  async function onRecordingStop() {
    timerEl.hidden = true;
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    if (blob.size === 0) {
      setStatus("Ready", "");
      showBanner("<strong>Nothing was recorded.</strong> Try holding the mic a little closer.", "info");
      return;
    }
    setStatus("Transcribing", "transcribing");
    recordBtn.disabled = true;

    const form = new FormData();
    const ext = (blob.type.includes("webm")) ? "webm" : "ogg";
    form.append("audio", blob, `clip.${ext}`);
    form.append("language", langSel.value);

    try {
      const r = await fetch("/api/transcribe", { method: "POST", body: form });
      if (!r.ok) {
        let detail = `Server error (${r.status})`;
        try { detail = (await r.json()).detail || detail; } catch {}
        setStatus("Ready", "");
        showBanner(`<strong>Couldn’t transcribe.</strong> ${detail}`);
        return;
      }
      const data = await r.json();
      if (!data.text) {
        setStatus("Ready", "");
        showBanner("<strong>No speech detected.</strong> The clip sounded silent. Try again.", "info");
        return;
      }
      insertText(data.text);
      const names = { pl: "Polish", en: "English" };
      detectedEl.textContent = `${names[data.language] || data.language} · ${data.duration_s}s → ${data.processing_s}s`;
      setStatus("Done", "done");
    } catch {
      setStatus("Ready", "");
      showBanner("<strong>Request failed.</strong> The server may have stopped. Check the terminal.");
    } finally {
      recordBtn.disabled = !modelReady;
    }
  }

  // ---- events ----
  recordBtn.addEventListener("click", () => (recording ? stopRecording() : startRecording()));
  langSel.addEventListener("change", () => localStorage.setItem(LS.lang, langSel.value));
  modeAppend.addEventListener("click", () => setMode("append"));
  modeReplace.addEventListener("click", () => setMode("replace"));
  pad.addEventListener("input", () => { updateCount(); scheduleSave(); });
  pad.addEventListener("blur", flushSave);
  newNoteBtn.addEventListener("click", newNote);

  $("copy").addEventListener("click", async (e) => {
    if (!pad.value) return;
    try {
      await navigator.clipboard.writeText(pad.value);
      const b = e.target; b.classList.add("copied"); b.textContent = "Copied ✓";
      setTimeout(() => { b.classList.remove("copied"); b.textContent = "Copy all"; }, 1400);
    } catch {
      pad.select(); document.execCommand("copy");
    }
  });
  $("clear").addEventListener("click", () => {
    if (pad.value && !confirm("Clear the text of this note?")) return;
    pad.value = ""; updateCount(); detectedEl.textContent = ""; scheduleSave(); pad.focus();
  });

  // Flush the pending save if the page is closing mid-edit (keepalive survives unload).
  window.addEventListener("beforeunload", () => {
    if (dirty && activeId) {
      clearTimeout(saveTimer);
      fetch(`/api/notes/${activeId}`, {
        method: "PUT", keepalive: true,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: pad.value }),
      });
    }
  });

  // Spacebar toggles recording — but only when no form control is focused, so it
  // doesn't fight the record/toggle buttons' own activation or type into the notepad.
  const FORM_TAGS = ["TEXTAREA", "BUTTON", "SELECT", "INPUT"];
  document.addEventListener("keydown", (e) => {
    const tag = (document.activeElement && document.activeElement.tagName) || "";
    if (e.code === "Space" && !FORM_TAGS.includes(tag) && modelReady) {
      e.preventDefault();
      if (e.repeat) return;  // holding Space must not toggle on every auto-repeat
      recording ? stopRecording() : startRecording();
    }
  });

  checkHealth();
  loadNotes();
})();
</script>
</body>
</html>
