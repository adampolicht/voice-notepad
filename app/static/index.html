<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice Notepad</title>
<style>
  :root {
    --paper: #f4efe4;
    --paper-edge: #ebe3d2;
    --ink: #23201a;
    --ink-soft: #6a6154;
    --ink-faint: #9a9082;
    --accent: #c8442b;      /* vermilion — recording */
    --accent-ink: #fbf6ec;
    --rule: #ddd3bf;
    --ok: #4a7a4a;
    --radius: 14px;
    --serif: "Iowan Old Style", "Charter", Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1a1815;
      --paper-edge: #211e1a;
      --ink: #ece5d6;
      --ink-soft: #a89e8c;
      --ink-faint: #6f6656;
      --accent: #e2593d;
      --accent-ink: #1a1815;
      --rule: #322d26;
      --ok: #7fae7f;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vw, 48px);
  }
  .shell {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 27px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  h1 .dot { color: var(--accent); }
  .meta {
    font-size: 12.5px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    text-align: right;
    line-height: 1.5;
  }

  /* Control bar */
  .controls {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .record {
    --size: 60px;
    position: relative;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    transition: transform .12s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease, opacity .2s ease;
    box-shadow: 0 2px 0 rgba(0,0,0,.12), 0 8px 22px -10px var(--accent);
  }
  .record:hover:not(:disabled) { transform: translateY(-1px); }
  .record:active:not(:disabled) { transform: translateY(1px) scale(.97); }
  .record:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .record .glyph { width: 22px; height: 22px; border-radius: 50%; background: currentColor; transition: border-radius .18s ease, width .18s ease, height .18s ease; }
  .record.recording { animation: pulse 1.6s ease-out infinite; }
  .record.recording .glyph { border-radius: 4px; width: 18px; height: 18px; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(200,68,43,.5), 0 2px 0 rgba(0,0,0,.12); }
    70%  { box-shadow: 0 0 0 16px rgba(200,68,43,0), 0 2px 0 rgba(0,0,0,.12); }
    100% { box-shadow: 0 0 0 0 rgba(200,68,43,0), 0 2px 0 rgba(0,0,0,.12); }
  }

  .status-block { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 550; }
  .status-line .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); flex: 0 0 auto; }
  .status-line.is-recording .pip { background: var(--accent); }
  .status-line.is-done .pip { background: var(--ok); }
  .status-line.is-transcribing .pip { background: var(--ink); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .timer { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--rule); border-top-color: var(--ink);
    animation: spin .7s linear infinite; display: none;
  }
  .is-transcribing .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .opts { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  select, .seg {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
  }
  select:focus-visible, .seg button:focus-visible, .record:focus-visible, .txt:focus-visible, .ghost:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .seg { padding: 3px; display: inline-flex; gap: 2px; }
  .seg button {
    border: none; background: transparent; color: var(--ink-soft);
    font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* Notepad */
  .pad {
    position: relative;
    background: var(--paper-edge);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 16px 40px -28px rgba(0,0,0,.5);
  }
  .txt {
    display: block;
    width: 100%;
    min-height: 46vh;
    resize: vertical;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.7;
    padding: 26px 26px 20px;
    outline-offset: -2px;
  }
  .txt::placeholder { color: var(--ink-faint); font-style: italic; }
  .txt.flash { animation: flash 1s ease; }
  @keyframes flash { from { background: rgba(200,68,43,.08); } to { background: transparent; } }

  footer {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-top: 1px solid var(--rule);
    font-size: 12.5px; color: var(--ink-soft);
  }
  .count { font-variant-numeric: tabular-nums; }
  footer .grow { margin-left: auto; display: flex; gap: 8px; }
  .ghost {
    font: inherit; font-size: 12.5px; font-weight: 550;
    border: 1px solid var(--rule); background: transparent; color: var(--ink);
    padding: 7px 13px; border-radius: 9px; cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .ghost:hover { background: rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) { .ghost:hover { background: rgba(255,255,255,.05); } }
  .ghost.copied { color: var(--ok); border-color: var(--ok); }

  .banner {
    display: none;
    align-items: flex-start; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    background: rgba(200,68,43,.1); border: 1px solid rgba(200,68,43,.35);
    color: var(--ink); font-size: 13.5px; line-height: 1.5;
  }
  .banner.show { display: flex; }
  .banner.info { background: rgba(0,0,0,.04); border-color: var(--rule); }
  @media (prefers-color-scheme: dark) { .banner.info { background: rgba(255,255,255,.04); } }
  .banner strong { font-weight: 650; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 520px) {
    .opts { margin-left: 0; width: 100%; }
    header { flex-direction: column; align-items: flex-start; gap: 4px; }
    .meta { text-align: left; }
  }
</style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Voice Notepad<span class="dot">.</span></h1>
      <div class="meta" id="meta">local · private</div>
    </header>

    <div class="banner" id="banner" role="alert"></div>

    <div class="controls">
      <button class="record" id="record" aria-label="Start recording" disabled>
        <span class="glyph"></span>
      </button>
      <div class="status-block">
        <div class="status-line" id="statusLine">
          <span class="pip"></span>
          <span id="statusText">Loading model…</span>
          <span class="spinner"></span>
        </div>
        <div class="timer" id="timer" hidden>00:00</div>
      </div>
      <div class="opts">
        <div class="seg" role="group" aria-label="Insert mode">
          <button id="modeAppend" aria-pressed="true">Append</button>
          <button id="modeReplace" aria-pressed="false">Replace</button>
        </div>
        <label class="visually-hidden" for="lang">Language</label>
        <select id="lang" aria-label="Language">
          <option value="auto">Auto-detect</option>
          <option value="pl">Polski</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <section class="pad">
      <textarea class="txt" id="pad" placeholder="Press record and start speaking. Your words land here — edit freely, then copy them wherever you like."></textarea>
      <footer>
        <span class="count" id="count">0 characters</span>
        <span id="detected"></span>
        <span class="grow">
          <button class="ghost" id="copy">Copy all</button>
          <button class="ghost" id="clear">Clear</button>
        </span>
      </footer>
    </section>
  </main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const pad = $("pad"), recordBtn = $("record"), statusLine = $("statusLine"),
        statusText = $("statusText"), timerEl = $("timer"), banner = $("banner"),
        langSel = $("lang"), countEl = $("count"), detectedEl = $("detected"),
        meta = $("meta"), modeAppend = $("modeAppend"), modeReplace = $("modeReplace");

  const LS = { text: "vn.text", lang: "vn.lang", mode: "vn.mode" };
  let mode = localStorage.getItem(LS.mode) || "append";
  let modelReady = false, recording = false, stream = null, recorder = null,
      chunks = [], tick = null, startedAt = 0;

  // ---- restore persisted state ----
  pad.value = localStorage.getItem(LS.text) || "";
  langSel.value = localStorage.getItem(LS.lang) || "auto";
  updateCount();
  setMode(mode);

  // ---- helpers ----
  function updateCount() {
    const n = pad.value.length;
    countEl.textContent = `${n.toLocaleString()} character${n === 1 ? "" : "s"}`;
  }
  function save() { localStorage.setItem(LS.text, pad.value); }
  function setStatus(text, state) {
    statusText.textContent = text;
    statusLine.className = "status-line" + (state ? " is-" + state : "");
  }
  function showBanner(html, kind = "error") {
    banner.className = "banner show" + (kind === "info" ? " info" : "");
    banner.innerHTML = html;
  }
  function clearBanner() { banner.className = "banner"; banner.innerHTML = ""; }
  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }
  function setMode(m) {
    mode = m;
    const app = m === "append";
    modeAppend.setAttribute("aria-pressed", String(app));
    modeReplace.setAttribute("aria-pressed", String(!app));
    localStorage.setItem(LS.mode, m);
  }

  function insertText(text) {
    if (mode === "replace") {
      pad.value = text;
    } else if (pad.value.trim() === "") {
      pad.value = text;
    } else {
      pad.value = pad.value.replace(/\s+$/, "") + "\n\n" + text;
    }
    save();
    updateCount();
    pad.scrollTop = pad.scrollHeight;
    pad.classList.remove("flash"); void pad.offsetWidth; pad.classList.add("flash");
  }

  // ---- health ----
  async function checkHealth() {
    try {
      const r = await fetch("/api/health");
      const h = await r.json();
      meta.textContent = `${h.model} · ${h.device} · local`;
      if (h.status === "ok") {
        modelReady = true;
        recordBtn.disabled = false;
        setStatus("Ready", "");
      } else {
        setStatus("Loading model…", "transcribing");
        setTimeout(checkHealth, 1200);
      }
    } catch {
      setStatus("Server unreachable", "");
      showBanner("<strong>Can’t reach the server.</strong> Is <code>uvicorn</code> running on this machine?");
      setTimeout(checkHealth, 2000);
    }
  }

  // ---- recording ----
  async function startRecording() {
    clearBanner();
    detectedEl.textContent = "";
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      showBanner(denied
        ? "<strong>Microphone blocked.</strong> Allow mic access for this site in your browser, then try again."
        : "<strong>No microphone found.</strong> Check that a mic is connected and available.");
      return;
    }
    chunks = [];
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
               : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onRecordingStop;
    recorder.start();

    recording = true;
    recordBtn.classList.add("recording");
    recordBtn.setAttribute("aria-label", "Stop recording");
    setStatus("Recording", "recording");
    startedAt = Date.now();
    timerEl.hidden = false; timerEl.textContent = "00:00";
    tick = setInterval(() => {
      timerEl.textContent = fmt(Math.floor((Date.now() - startedAt) / 1000));
    }, 250);
  }

  function stopRecording() {
    if (!recorder) return;
    recording = false;
    clearInterval(tick);
    recordBtn.classList.remove("recording");
    recordBtn.setAttribute("aria-label", "Start recording");
    recorder.stop();
    stream.getTracks().forEach((t) => t.stop());
  }

  async function onRecordingStop() {
    timerEl.hidden = true;
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    if (blob.size === 0) {
      setStatus("Ready", "");
      showBanner("<strong>Nothing was recorded.</strong> Try holding the mic a little closer.", "info");
      return;
    }
    setStatus("Transcribing", "transcribing");
    recordBtn.disabled = true;

    const form = new FormData();
    const ext = (blob.type.includes("webm")) ? "webm" : "ogg";
    form.append("audio", blob, `clip.${ext}`);
    form.append("language", langSel.value);

    try {
      const r = await fetch("/api/transcribe", { method: "POST", body: form });
      if (!r.ok) {
        let detail = `Server error (${r.status})`;
        try { detail = (await r.json()).detail || detail; } catch {}
        setStatus("Ready", "");
        showBanner(`<strong>Couldn’t transcribe.</strong> ${detail}`);
        return;
      }
      const data = await r.json();
      if (!data.text) {
        setStatus("Ready", "");
        showBanner("<strong>No speech detected.</strong> The clip sounded silent — try again.", "info");
        return;
      }
      insertText(data.text);
      const names = { pl: "Polish", en: "English" };
      detectedEl.textContent = `${names[data.language] || data.language} · ${data.duration_s}s in ${data.processing_s}s`;
      setStatus("Done", "done");
    } catch {
      setStatus("Ready", "");
      showBanner("<strong>Request failed.</strong> The server may have stopped — check the terminal.");
    } finally {
      recordBtn.disabled = !modelReady;
    }
  }

  // ---- events ----
  recordBtn.addEventListener("click", () => (recording ? stopRecording() : startRecording()));
  langSel.addEventListener("change", () => localStorage.setItem(LS.lang, langSel.value));
  modeAppend.addEventListener("click", () => setMode("append"));
  modeReplace.addEventListener("click", () => setMode("replace"));
  pad.addEventListener("input", () => { save(); updateCount(); });

  $("copy").addEventListener("click", async (e) => {
    if (!pad.value) return;
    try {
      await navigator.clipboard.writeText(pad.value);
      const b = e.target; b.classList.add("copied"); b.textContent = "Copied ✓";
      setTimeout(() => { b.classList.remove("copied"); b.textContent = "Copy all"; }, 1400);
    } catch {
      pad.select(); document.execCommand("copy");
    }
  });
  $("clear").addEventListener("click", () => {
    if (pad.value && !confirm("Clear the whole notepad?")) return;
    pad.value = ""; save(); updateCount(); detectedEl.textContent = ""; pad.focus();
  });

  // Spacebar toggles recording when the notepad isn't focused.
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && document.activeElement !== pad && modelReady) {
      e.preventDefault();
      recording ? stopRecording() : startRecording();
    }
  });

  checkHealth();
})();
</script>
</body>
</html>
